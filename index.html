<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#101114;--p:#1E2026;--o:#F8FAFC;--g:#9aa0aa;--d:#4a4d55;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--o);font:16px system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#16171b;border-bottom:1px solid #2e3037}
nav{display:flex;gap:10px;font:italic 17px var(--serif)}
nav button{color:var(--d)}nav button.on{color:var(--o);font-size:21px}
.chip{white-space:nowrap;font-size:14px;color:var(--g);display:flex;gap:6px;align-items:center}
main{flex:1;overflow-y:auto;position:relative}
.pad{padding:16px}
h2{font:italic 28px var(--serif);margin:6px 0 12px}
.card{background:var(--p);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:var(--o);color:var(--bg);border-radius:14px;padding:14px;width:100%;font-weight:700}
.btn:disabled{background:var(--p);color:var(--d)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--d);flex:none;display:grid;place-items:center}
.ck.on{background:var(--o);border-color:var(--o);color:var(--bg)}
input.r{width:64px;background:var(--bg);border:1px solid var(--d);border-radius:10px;color:var(--o);padding:8px;text-align:center;font-size:16px}
.muted{color:var(--g);font-size:14px}
.wheel{min-height:100%;display:flex;flex-direction:column;align-items:center;background:repeating-radial-gradient(circle at 50% 100%,transparent 0 150px,#23252b 151px 153px);touch-action:pan-y}
.line{display:flex;flex-direction:column-reverse;align-items:center;padding:20px 0 6px}
.node{display:flex;flex-direction:column;align-items:center;position:relative;padding-bottom:26px;text-align:center}
.node:not(:first-child)::after{content:"";position:absolute;bottom:-4px;width:4px;height:30px;background:var(--d);z-index:0}
.node.done:not(:first-child)::after{background:var(--o)}
.nc{width:86px;height:86px;border-radius:50%;background:var(--bg);border:4px solid var(--d);z-index:1;position:relative}
.node.done .nc{border-color:var(--o)}.node.cur .nc{border:7px solid var(--o);box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--g)}
.node.done .nc::after{content:"✓";position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:var(--o);color:var(--bg);font-weight:700;display:grid;place-items:center;font-size:15px}
.nc svg{width:100%;height:100%}.nc img,.big img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}.ic.lk{filter:grayscale(1) brightness(.4)}.big{overflow:hidden}
.nm{font-weight:700;font-size:14px;margin-top:8px;background:var(--bg);padding:0 6px;z-index:1}.node.lock .nm{color:var(--d)}.gl{font-size:12px;color:var(--g);background:var(--bg);padding:0 6px;z-index:1}
.hub{position:sticky;bottom:0;width:100%;height:150px;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.hub>*{pointer-events:auto}
.hc{width:130px;height:130px;border-radius:50%;border:3px solid var(--o);background:#16171b;display:grid;place-items:center;margin-bottom:-45px;font:italic 32px var(--serif)}
.hs{position:absolute;bottom:50px;width:74px;height:74px;border-radius:50%;background:var(--p);border:3px solid var(--d);color:var(--g);font-weight:700;font-size:13px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:5}.sheet.on{display:flex}
.sheet>div{background:var(--p);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
.big{width:150px;height:150px;border-radius:50%;border:5px solid var(--o);background:var(--bg);margin:0 auto 10px}
.chips{display:flex;gap:10px;justify-content:center;margin:12px 0}.chips span{background:var(--bg);border:1px solid var(--d);border-radius:14px;padding:8px 14px;font-weight:700}
input.t{width:100%;background:var(--bg);border:1px solid var(--d);border-radius:12px;color:var(--o);padding:12px;margin-bottom:10px;font-size:16px}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--o);color:var(--bg);border-radius:30px;padding:10px 20px;font-weight:700;display:none;z-index:4}
#flame{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}#flame.on{display:flex}
#flame .back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;font-size:32px;color:var(--g)}
.fl{width:260px;height:300px;position:relative}.fl svg{width:100%;height:100%;overflow:visible}.fl b{position:absolute;inset:0;display:grid;place-items:center;font:800 120px system-ui;color:var(--bg);padding-top:70px}
.l1,.l2,.l3{transform-box:fill-box;transform-origin:50% 100%}
.l1{animation:f1 1.3s ease-in-out infinite}.l2{animation:f2 .9s ease-in-out infinite}.l3{animation:f1 .7s ease-in-out infinite reverse}
@keyframes f1{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.97,1.07) skewX(2deg)}65%{transform:scale(1.03,.96) skewX(-2deg)}}
@keyframes f2{0%,100%{transform:scale(1,1)}50%{transform:scale(.95,1.1) skewX(-3deg)}}
.em{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--o);bottom:90px;opacity:0;animation:up 2.4s linear infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-230px) translateX(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.l1,.l2,.l3,.em{animation:none}}
.wk{display:flex;justify-content:space-between}.wk div{text-align:center;font-size:12px;color:var(--g)}.wk i{display:block;width:34px;height:34px;border-radius:50%;border:2px solid var(--d);margin-top:4px}.wk i.on{background:var(--o);border-color:var(--o)}.wk i.rd{border-color:var(--o)}
</style></head><body>
<div id="app"><header><button id="acct" class="chip">☰ <span id="who">Sign in</span></button><nav id="nav"><button data-t="w">Workout</button><button data-t="s" class="on">Skills</button><button data-t="p">Progress</button></nav><button id="st" class="chip">▲ <span id="sn">0</span> wk</button></header><main id="main"></main></div>
<div id="timer"></div>

<i class="em" style="left:90px;animation-delay:0s"></i><i class="em" style="left:150px;animation-delay:.8s"></i><i class="em" style="left:120px;animation-delay:1.5s"></i><i class="em" style="left:70px;animation-delay:2s"></i></div><div style="font:800 40px system-ui;margin-top:30px">Weekly Streak</div><div class="muted" style="margin-top:8px">Finish all 3 sessions each week to keep it going</div></div>
<script type="module">
import cfg from './firebase-config.js';
const P={wall:[67,30,58,40,40,64,30,78,20,92,74,42,88,40,'wall'],inc:[72,44,62,54,42,70,26,80,8,90,70,60,80,62,'box1'],push:[76,60,64,66,42,74,24,80,6,86,65,76,66,88],dec:[77,68,66,72,46,60,28,52,10,46,68,80,68,89,'box2'],pike:[66,76,62,60,40,30,27,60,14,88,65,74,66,88],plan:[80,50,70,58,40,66,24,76,6,84,64,72,60,88],hang:[50,26,50,34,50,62,50,78,50,94,44,22,46,8,'bar'],up:[50,10,50,22,50,50,50,66,50,82,40,26,46,8,'bar'],squat:[50,22,50,34,38,62,60,64,48,90,58,44,68,38],lunge:[50,20,50,32,50,58,68,68,64,92,44,46,46,58],plank:[80,62,66,66,42,70,24,76,6,84,66,84,76,86],lie:[88,66,74,72,46,78,26,70,8,62,84,64,94,58],kr:[50,26,50,34,50,60,64,56,60,74,44,22,46,8,'bar'],lr:[50,26,50,34,50,60,68,60,88,60,44,22,46,8,'bar'],ls:[40,40,40,48,40,70,62,70,84,70,40,64,40,82]};
const B={push:{n:'Push',ex:[['Wall push-up','wall','Stand an arm and a half from the wall, lower your chest to it.'],['Incline push-up','inc','Hands on a chair or box, body in one line.'],['Push-up','push','Hands under shoulders, chest nearly to the floor, hips level.'],['Diamond push-up','push','Hands close together, elbows tight to your body.'],['Decline push-up','dec','Feet on a chair, same straight body line.'],['Pike push-up','pike','Hips high, lower the top of your head between your hands.'],['Archer push-up','push','Wide hands, lower over one arm while the other stays straight.'],['Pseudo planche','plan','Hands by your hips, lean forward past your hands, then push-up.'],['One-arm push-up','push','Feet wide, one hand behind your back, keep hips square.']]},
pull:{n:'Pull',ex:[['Scapular pulls','hang','Hang, pull your shoulder blades down without bending your arms.'],['Heavy band pull-up','hang','Thick band under feet or knees, chin over the bar.'],['Light band pull-up','hang','Thinner band, same full range.'],['Pull-up','up','No band, start from a dead hang, chin over the bar.'],['Wide pull-up','up','Hands wider than shoulders.'],['Archer pull-up','up','Pull toward one hand while the other arm stays straight.'],['Chest-to-bar','up','Pull until your chest touches the bar.'],['Explosive pull-up','up','Pull fast and high, control the way down.'],['Muscle-up','up','Pull high, lean over the bar and press out.']]},
legs:{n:'Legs',ex:[['Squat','squat','Feet shoulder width, hips back and down, knees over toes.'],['Reverse lunge','lunge','Step back, back knee nearly touches the floor.'],['Split squat','lunge','Feet staggered, drop straight down and up.'],['Bulgarian split squat','lunge','Back foot on a chair, front knee over the toes.'],['Jump squat','squat','Squat, then jump, land softly.'],['Skater squat','squat','Balance on one leg, back knee lowers behind you.'],['Assisted pistol','squat','One-leg squat holding a doorframe or bar.'],['Shrimp squat','lunge','Hold the back foot, lower the knee to the floor.'],['Pistol squat','squat','One-leg squat, other leg straight in front.']]},
core:{n:'Core',ex:[['Plank','plank','Forearms down, body in one line, squeeze glutes.'],['Superman','lie','Lie face down, lift arms and legs, hold.'],['Knee raise','kr','Hang from the bar, lift knees to your chest.'],['Hollow hold','lie','Lower back pressed down, arms and legs low.'],['Hollow crunch','lie','From the hollow shape, rock up and down.'],['Archup','lie','Face down, arch up like a rocking boat.'],['Leg raise','lr','Hang, lift straight legs to hip height.'],['L-sit','ls','Hands on the floor or chairs, legs straight out.'],['Toes to bar','lr','Hang, lift straight legs to touch the bar.']]}};
const BK=Object.keys(B),HOLD=['Plank','Superman','Hollow hold','L-sit','Scapular pulls'];
const goal=(b,i)=>{const h=HOLD.includes(B[b].ex[i][0]);return h?['3 x 30s',30]:i>=6?['3 x 8',8]:['3 x 15',15]};
const RT=['Walk 30 min briskly, then stretch 10 min.','Training day','Jog 1 min / walk 2 min for 30 min, then stretch 10 min.','Training day','Training day','Bodyweight cardio 20 min (jacks, high knees, mountain climbers), then stretch 10 min.','Stretch your whole body 30 min, then walk easy 10-15 min.'];
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],TR=[0,2,4];
const WU=['Jumping jacks 30 s','Overhead squats x 10','Lunge and reach x 5 each side','1 easy set of each exercise'];
let S=JSON.parse(localStorage.sw||'null')||{u:0,lv:{push:0,pull:0,legs:0,core:0},log:{},hist:{},pb:{},rdy:{}};
let tab='s',br=0,user=null,fb=null,db=null,tmr=null;
const $=s=>document.querySelector(s),key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mon=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wd=ws=>TR.every(o=>S.log[key(add(ws,o))]?.done);
const streak=()=>{let w=mon(new Date()),n=0;if(wd(w))n++;w=add(w,-7);for(let i=0;i<520&&wd(w);i++){n++;w=add(w,-7)}return n};
let to;const save=()=>{S.u=Date.now();localStorage.sw=JSON.stringify(S);clearTimeout(to);if(db&&user)to=setTimeout(()=>fb.setDoc(fb.doc(db,'users',user.uid),{d:JSON.stringify(S)}),700)};
function fig(p,lock){const o=lock?'#4a4d55':'#F8FAFC',f=lock?'#181a1f':'#2a2c34',pr=p[14];
const H=[p[0],p[1]],S=[p[2],p[3]],P=[p[4],p[5]],K=[p[6],p[7]],A=[p[8],p[9]],E=[p[10],p[11]],W=[p[12],p[13]];
const lp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],un=(a,b)=>{const l=Math.hypot(b[0]-a[0],b[1]-a[1])||1;return[(b[0]-a[0])/l,(b[1]-a[1])/l]};
const nr=(a,b)=>{const u=un(a,b);let n=[-u[1],u[0]];if(n[1]>0||(n[1]==0&&n[0]<0))n=[-n[0],-n[1]];return n};
const ad=(c,n,d)=>[c[0]+n[0]*d,c[1]+n[1]*d];
const cap=(a,b,wa,wb)=>{const n=un(a,b),x=-n[1],y=n[0],ra=wa/2,rb=wb/2;return`M${a[0]+x*ra} ${a[1]+y*ra}L${b[0]+x*rb} ${b[1]+y*rb}L${b[0]-x*rb} ${b[1]-y*rb}L${a[0]-x*ra} ${a[1]-y*ra}Z`};
const C=(c,r)=>q=>`<circle cx="${c[0]}" cy="${c[1]}" r="${r}" ${q}/>`,T=(a,b,wa,wb)=>q=>`<path d="${cap(a,b,wa,wb)}" ${q}/>`;
const m1=lp(P,K,.45),G=[
[T(P,m1,12.5,12),T(m1,K,12,8.5),C(lp(P,K,.35),6.8),T(K,A,8,4.5),C(lp(K,A,.3),4.6),C(A,3.2)],
[T(S,P,18,12.5),C(lp(S,P,.22),9.8),C(P,7.2)],
[T(S,E,9.5,7),C(lp(S,E,.45),5.2),C(S,7.6),T(E,W,6.8,4.2),C(lp(E,W,.3),4),C(W,3.2)],
[T(S,H,8,6),C(H,8.6)]];
let s='<svg viewBox="0 0 100 100">';
if(pr=='wall')s+=`<path d="M90 8V96" stroke="${o}" stroke-width="3"/>`;if(pr=='box1')s+=`<rect x="74" y="62" width="22" height="30" fill="none" stroke="${o}" stroke-width="3"/>`;if(pr=='box2')s+=`<rect x="2" y="48" width="22" height="42" fill="none" stroke="${o}" stroke-width="3"/>`;if(pr=='bar')s+=`<path d="M28 8H72" stroke="${o}" stroke-width="3"/>`;
G.forEach(g=>{s+=g.map(e=>e(`fill="${o}" stroke="${o}" stroke-width="4.5" stroke-linejoin="round"`)).join('')+g.map(e=>e(`fill="${f}"`)).join('')});
const ln=(a,b,c,w,op)=>`<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
if(!lock){const d=un(S,H),fc=ad(H,d,4),nT=nr(S,P),nL=nr(P,K),nA=nr(S,E),nC=nr(K,A),nF=nr(E,W),dk='#101114';
s+=`<circle cx="${fc[0]}" cy="${fc[1]}" r="3.8" fill="${dk}"/>`;
const rim=(a,b,n,d0,t0,t1)=>ln(ad(lp(a,b,t0),n,d0),ad(lp(a,b,t1),n,d0),o,1.2,.7);
s+=rim(S,P,nT,6,.05,.9)+rim(P,K,nL,4.8,.15,.8)+rim(K,A,nC,3.2,.2,.8)+rim(S,E,nA,3,.2,.8)+rim(E,W,nF,2.4,.2,.8);
const ab=t=>{const c=lp(S,P,t),n=nr(S,P);return ln(ad(c,n,-2),ad(c,n,2.6),dk,1,.9)};
s+=ab(.72);

s+=ln(lp(P,K,.25),lp(P,K,.7),dk,.9,.8)+ln(lp(S,E,.3),lp(S,E,.7),dk,.8,.7)}

const ico=(b,i,lk)=>`<img class="ic${lk?' lk':''}" src="${b}${Math.min(i,8)+1}.webp" alt="" draggable="false" onerror="this.style.visibility='hidden'">`;
const ex=(b,i)=>B[b].ex[Math.min(i,8)];

$('#sheet').onclick=e=>{if(e.target.id=='sheet')e.currentTarget.classList.remove('on')};
function skills(){const b=BK[br],lv=S.lv[b];let n='';
B[b].ex.forEach((e,i)=>{const c=i<lv?'done':i==lv?'cur':'lock';n+=`<div class="node ${c}" data-i="${i}"><div class="nc">${ico(b,i,c=='lock')}</div><div class="nm">${e[0]}</div><div class="gl">${goal(b,i)[0]}</div></div>`});

function today(){const d=new Date(),k=key(d),dow=(d.getDay()+6)%7;S.log[k]=S.log[k]||{w:{},wu:[]};return[S.log[k],dow,k]}

if(TR.includes(dow)){h+=`<div class="card"><b>Warm-up</b>${WU.map((t,i)=>`<div class="row"><div class="ck ${L.wu[i]?'on':''}" data-wu="${i}">${L.wu[i]?'✓':''}</div>${t}</div>`).join('')}</div>`;
BK.forEach(b=>{const lv=Math.min(S.lv[b],8),e=B[b].ex[lv],g=goal(b,lv),s=L.w[b]||[0,0,0].map(()=>[0,0]);h+=`<div class="card"><div class="row"><div style="width:56px;height:56px;border-radius:50%;border:3px solid var(--o);flex:none;overflow:hidden">${ico(b,lv)}</div><div><b>${e[0]}</b><div class="muted">${B[b].n} · ${g[0]}${S.rdy[b]?' · goal hit, mark it mastered in Skills':''}</div></div></div>${s.map((v,j)=>`<div class="row"><span class="muted" style="width:44px">Set ${j+1}</span><input class="r" type="number" inputmode="numeric" placeholder="${g[1]}" value="${v[0]||''}" data-b="${b}" data-j="${j}"><div class="ck ${v[1]?'on':''}" data-b="${b}" data-j="${j}">${v[1]?'✓':''}</div></div>`).join('')}</div>`});
const all=BK.every(b=>(L.w[b]||[]).length==3&&L.w[b].every(v=>v[1]));h+=`<button class="btn" id="fin" ${all&&!L.done?'':'disabled'}>${L.done?'Session done':'Finish session'}</button>`}
else h+=`<div class="card"><b>Rest day</b><p style="margin:8px 0">${RT[dow]}</p><button class="btn" id="fin">${L.done?'Done':'Mark done'}</button></div>`;
h+=`<h2 style="margin-top:18px">This week</h2><div class="card">${DN.map((n,i)=>`<div class="row"><b style="width:44px;${i==dow?'':'color:var(--g)'}">${n}</b><span class="muted">${TR.includes(i)?'Full body: warm-up, push, pull, legs, core':RT[i]}</span></div>`).join('')}</div></div>`;
$('#main').innerHTML=h;
document.querySelectorAll('[data-wu]').forEach(c=>c.onclick=()=>{L.wu[c.dataset.wu]=!L.wu[c.dataset.wu];save();workout()});
document.querySelectorAll('.r').forEach(r=>r.onchange=()=>{const a=L.w[r.dataset.b]=L.w[r.dataset.b]||[[0,0],[0,0],[0,0]];a[r.dataset.j][0]=+r.value;save()});
document.querySelectorAll('.ck[data-b]').forEach(c=>c.onclick=()=>{const b=c.dataset.b,j=+c.dataset.j,a=L.w[b]=L.w[b]||[[0,0],[0,0],[0,0]],inp=document.querySelector(`.r[data-b=${b}][data-j="${j}"]`);if(!a[j][1]){const v=+inp.value;if(!v)return toast('Enter your reps first');a[j]=[v,1];if(j<2||a.some(z=>!z[1]))rest()}else a[j][1]=0;save();workout()});
$('#fin')?.addEventListener('click',()=>{if(TR.includes(dow)){const before=streak();BK.forEach(b=>{const lv=Math.min(S.lv[b],8),nm=ex(b,lv)[0],r=L.w[b].map(v=>v[0]),best=Math.max(...r);(S.hist[nm]=S.hist[nm]||[]).push([k,best]);S.pb[nm]=Math.max(S.pb[nm]||0,best);if(r.every(v=>v>=goal(b,lv)[1]))S.rdy[b]=1});L.done=1;save();if(streak()>before)toast('Week complete! Streak '+streak())}else{L.done=!L.done;save()}render()})}
function progress(){const ws=mon(new Date()),tn=streak();let h=`<div class="pad"><button class="card" id="sb" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center"><span><b style="font-size:30px">${tn}</b> week streak<div class="muted">Tap for the flame</div></span><span style="font-size:34px">▲</span></button><div class="card"><div class="wk">${DN.map((n,i)=>{const d=S.log[key(add(ws,i))]?.done;return`<div>${n}<i class="${d?(TR.includes(i)?'on':'rd'):''}"></i></div>`}).join('')}</div></div><div class="card"><b>Mastered</b>${BK.map(b=>`<div class="row"><span style="width:60px">${B[b].n}</span><div style="flex:1;height:8px;background:var(--bg);border-radius:4px"><div style="width:${S.lv[b]/9*100}%;height:100%;background:var(--o);border-radius:4px"></div></div><span class="muted">${S.lv[b]}/9</span></div>`).join('')}</div>`;
const names=Object.keys(S.hist);h+=`<div class="card"><b>Rep history</b>${names.length?`<select id="cs" class="t" style="margin:10px 0">${names.map(n=>`<option>${n}</option>`).join('')}</select><div id="ch"></div>`:'<p class="muted" style="margin-top:6px">Finish a session to see your chart.</p>'}</div><div class="card"><b>Personal bests</b>${Object.entries(S.pb).map(([n,v])=>`<div class="row"><span style="flex:1">${n}</span><b>${v}</b></div>`).join('')||'<p class="muted" style="margin-top:6px">No reps logged yet.</p>'}</div></div>`;
$('#main').innerHTML=h;$('#sb').onclick=()=>{$('#fn').textContent=streak();$('#flame').classList.add('on')};
const draw=()=>{const a=S.hist[$('#cs').value].slice(-14),m=Math.max(...a.map(v=>v[1]),1),pt=a.map((v,i)=>`${10+i*(280/Math.max(a.length-1,1))},${100-v[1]/m*85}`).join(' ');$('#ch').innerHTML=`<svg viewBox="0 0 300 110" width="100%"><polyline points="${pt}" fill="none" stroke="#F8FAFC" stroke-width="3"/>${pt.split(' ').map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="#F8FAFC"/>`).join('')}</svg><div class="muted">Best reps per session, last ${a.length}. Top = ${m}</div>`};if(names.length){$('#cs').onchange=draw;draw()}}
function render(){$('#sn').textContent=streak();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));({w:workout,s:skills,p:progress})[tab]()}
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};$('#st').onclick=()=>{$('#fn').textContent=streak();$('#flame').classList.add('on')};$('#fb').onclick=()=>$('#flame').classList.remove('on');
$('#acct').onclick=()=>{if(!fb)return sheet('<h2>Account</h2><p class="muted">Add your Firebase keys in firebase-config.js to sign in and sync across devices. Until then, progress is saved on this device.</p>');
sheet(user?`<h2>Account</h2><p>${user.email}</p><p class="muted" style="margin:8px 0 16px">Your progress syncs to every device you sign in on.</p><button class="btn" id="so">Sign out</button>`:`<h2>Sign in</h2><input class="t" id="em" type="email" placeholder="Email"><input class="t" id="pw" type="password" placeholder="Password"><p class="muted" id="er" style="margin-bottom:10px"></p><button class="btn" id="si">Sign in</button><button class="btn" id="su" style="margin-top:10px;background:var(--bg);color:var(--o)">Create account</button><button class="btn" id="go" style="margin-top:10px;background:var(--bg);color:var(--o)">Continue with Google</button>`);
const go=f=>async()=>{try{await f();$('#sheet').classList.remove('on')}catch(x){$('#er').textContent=x.code?.replace('auth/','').replace(/-/g,' ')||'Something went wrong'}},A=fb.auth;
if(user)$('#so').onclick=()=>fb.signOut(A).then(()=>$('#sheet').classList.remove('on'));else{$('#si').onclick=go(()=>fb.signInWithEmailAndPassword(A,$('#em').value,$('#pw').value));$('#su').onclick=go(()=>fb.createUserWithEmailAndPassword(A,$('#em').value,$('#pw').value));$('#go').onclick=go(()=>fb.signInWithPopup(A,new fb.GoogleAuthProvider()))}};
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(cfg.apiKey&&!cfg.apiKey.startsWith('YOUR')){try{const V='https://www.gstatic.com/firebasejs/10.12.2/',[a,t,s]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);const app=a.initializeApp(cfg);fb={...t,...s,auth:t.getAuth(app)};db=s.getFirestore(app);let un;
t.onAuthStateChanged(fb.auth,u=>{user=u;$('#who').textContent=u?u.email.split('@')[0]:'Sign in';un?.();if(u)un=s.onSnapshot(s.doc(db,'users',u.uid),d=>{const r=d.exists()&&JSON.parse(d.data().d);if(r&&r.u>S.u){S=r;localStorage.sw=JSON.stringify(S);render()}else if(!r||r.u<S.u)save()})})}catch(e){console.warn('Firebase unavailable',e)}}
</script></body></html>
